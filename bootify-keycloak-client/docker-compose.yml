services:
  mysql:
    image: mysql:9.5
    environment:
    - MYSQL_DATABASE=bootify-keycloak-client
    - MYSQL_ROOT_PASSWORD=P4ssword!
    ports:
    - 3307:3306
  redis:
    image: redis:8.2-alpine
    environment:
    - REDIS_PASSWORD=P4ssword!
    ports:
    - 6380:6379
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.4
    environment:
    - KEYCLOAK_ADMIN=admin
    - KEYCLOAK_ADMIN_PASSWORD=P4ssword!
    command:
    - start-dev
    - --import-realm
    volumes:
    - ./src/test/resources/keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json
    ports:
    - 8085:8080
