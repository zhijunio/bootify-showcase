spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/bootify-keycloak-client?serverTimezone=UTC}
    username: ${JDBC_DATABASE_USERNAME:root}
    password: ${JDBC_DATABASE_PASSWORD:<<YOUR_PASSWORD>>}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: io.bootify.bootify_keycloak_client.config.BootifyKeycloakClientNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  security:
    oauth2:
      client:
        provider:
          keycloak-test-realm:
            issuer-uri: http://localhost:8085/realms/test-realm
        registration:
          keycloak-test-client:
            client-id: test-client
            client-secret: ${KEYCLOAK_CLIENT_SECRET:B3D9B63A0859BDBC559C2F6FC8B79C35}
            client-name: Test Client
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/test-client
            scope: openid,profile,email,offline_access
            provider: keycloak-test-realm
  docker:
    compose:
      lifecycle-management: start-only
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      UserNameUnique: USER_NAME_UNIQUE
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
springdoc:
  pathsToMatch: /api/**
