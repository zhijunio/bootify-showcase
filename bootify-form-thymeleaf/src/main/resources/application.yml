spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/bootify-form-thymeleaf?serverTimezone=UTC}
    username: ${JDBC_DATABASE_USERNAME:root}
    password: ${JDBC_DATABASE_PASSWORD:<<YOUR_PASSWORD>>}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: io.bootify.bootify_form_thymeleaf.config.BootifyFormThymeleafNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  liquibase:
    change-log: classpath:domain/changelog-master.yml
    drop-first: false
  mail:
    host: ${SMTP_HOST:email-smtp.eu-central-1.amazonaws.com}
    username: ${SMTP_USERNAME:<<YOUR_USERNAME>>}
    password: ${SMTP_PASSWORD:<<YOUR_PASSWORD>>}
    port: 587
    properties.mail.smtp:
      auth: true
      starttls:
        enable: true
        required: true
      connectiontimeout: 15000
      timeout: 45000
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:Ov23likOi21AwqpT9WUP}
            client-secret: ${GITHUB_CLIENT_SECRET:2cb389b00b067c731e073864cf3d744fb36ed92e}
            scope: read:user
            authorization-grant-type: authorization_code
            client_authentication_method: client_secret_post
  docker:
    compose:
      lifecycle-management: start-only
  session:
    jdbc.initialize-schema: always
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    http-statuses:
      org.springframework.security.authorization.AuthorizationDeniedException: unauthorized
    codes:
      UserNameUnique: USER_NAME_UNIQUE
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
springdoc:
  pathsToMatch: /api/**
app:
  baseHost: ${BASE_HOST:http://localhost:8080}
  mail:
    from: bob@invalid.bootify.io
